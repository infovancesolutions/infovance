# Redirects for SPA - but exclude static assets
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  force = true
  # Don't redirect files with extensions (assets)
  conditions = { Path = "/*", Not = { Path = "/assets/*" } }

# Alternative: More specific redirect rules
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
  # Only apply to routes that don't have a file extension
  force = true

[[redirects]]
  from = "/assets/*"
  to = "/assets/:splat"
  status = 200
  force = true